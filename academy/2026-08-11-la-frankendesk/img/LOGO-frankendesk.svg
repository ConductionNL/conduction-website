<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 130" width="540" height="130">
  <!-- Back frame (lighter purple, white center) -->
  <rect x="26" y="28" width="64" height="64" rx="12" ry="12" fill="#ffffff" stroke="#927afa" stroke-width="10"/>

  <!-- Front frame (darker purple, white center) -->
  <rect x="42" y="44" width="64" height="64" rx="12" ry="12" fill="#ffffff" stroke="#571efa" stroke-width="14"/>

  <!-- Stitches running the entire perimeter of the front frame's band -->
  <rect x="42" y="44" width="64" height="64" rx="12" ry="12" fill="none" stroke="#111111" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 6"/>

  <!-- Solid black neck bolts -->
  <rect x="14" y="68" width="14" height="8" rx="1.5" fill="#111111"/>
  <rect x="102" y="68" width="14" height="8" rx="1.5" fill="#111111"/>

  <!-- Wordmark -->
  <text x="140" y="84"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="40"
        font-weight="600"
        letter-spacing="-0.6">
    <tspan fill="#1a1a2e">La </tspan>
    <tspan fill="#571efa">Franken</tspan>
    <tspan fill="#1a1a2e">desk</tspan>
  </text>

  <!-- Underline -->
  <rect x="140" y="94" width="290" height="2.5" rx="1.2" fill="#571efa" opacity="0.3"/>
</svg>
