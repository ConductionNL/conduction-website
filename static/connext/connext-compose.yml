# Connext — the whole ecosystem, locally, in one command
#
#   docker compose -f connext-compose.yml up -d
#
# Then open  http://localhost:8700  (admin / admin)
#
# Tear down, including all data:
#   docker compose -f connext-compose.yml down -v
#
# Needs Docker Compose v2.23 or newer. Older versions ignore the `content:`
# field on a config without saying so, which yields an instance with no apps
# installed and no error to explain it.
#
# ---------------------------------------------------------------------------
# THIS IS A DEMO ENVIRONMENT, NOT A DEVELOPMENT ENVIRONMENT.
#
# Nothing is bind-mounted from a working copy, deliberately. Nextcloud installs
# and updates an app by DELETING its directory and extracting a fresh archive
# over it — point that at a checkout and an app-store update deletes the
# checkout. Measured 2026-08-27 on a development machine, where
# `\OC\Updater::upgradeAppStoreApp` fired on a container restart and removed
# every top-level file from a bind-mounted app, including its `.git` directory.
#
# To work ON these apps rather than WITH them, use a development environment.
#
# ---------------------------------------------------------------------------
# WHY RELEASE ARCHIVES RATHER THAN `git clone`
#
# A release archive is a COMPLETE app: it carries `vendor/` and the built `js/`
# bundle. A git clone carries neither, and a Nextcloud app whose `vendor/` is
# missing does NOT fail loudly — `include_once` warns once and the app keeps
# loading, so it looks installed while every service that needs a dependency is
# quietly absent.
#
# ---------------------------------------------------------------------------
# VERSIONS
#
# Most Connext apps do not yet publish a stable release, so by default each app
# resolves to its NEWEST release, pre-releases included. That is honest about
# what exists rather than pinning to tags that do not.
#
# Pin any app explicitly when you need a reproducible environment:
#
#   OPENREGISTER_VERSION=1.1.6 OPENCATALOGI_VERSION=1.0.9 \
#     docker compose -f connext-compose.yml up -d
#
# ---------------------------------------------------------------------------
# THREE NAMES PER APP, AND THEY ARE NOT THE SAME NAME
#
# The fleet renamed many apps in 2026, and the rename reached the three names
# at different times. The installer therefore carries all three per app:
#
#   repo      the GitHub repository            (versioniq)
#   app id    the DIRECTORY Nextcloud loads    (app_versions)
#   asset     the archive filename             (app_versions-1.4.1-….tar.gz)
#
# Nextcloud resolves an app by its DIRECTORY name, and REFUSES an archive whose
# appinfo/info.xml declares a different <id>: "App X cannot be installed because
# appinfo file cannot be read." Measured while writing this file — thematiq was
# installed as `nldesign` on the assumption that the id had not moved with the
# repo, and it had. The <id> in the RELEASED archive is the only authority; a
# local checkout can be on a branch where it has not moved yet.

name: connext-demo

volumes:
  db:
  nextcloud:
  apps:

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: nextcloud
      POSTGRES_DB: nextcloud
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextcloud -d nextcloud"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Populates the shared `apps` volume, then exits. Nextcloud waits for that
  # exit, so it never boots against a half-populated app directory.
  # Idempotent: an app already present is skipped rather than re-downloaded.
  app-installer:
    image: alpine:3.20
    restart: "no"
    environment:
      OPENREGISTER_VERSION: ${OPENREGISTER_VERSION:-}
      OPENCATALOGI_VERSION: ${OPENCATALOGI_VERSION:-}
      PORTALIQ_VERSION: ${PORTALIQ_VERSION:-}
      THEMATIQ_VERSION: ${THEMATIQ_VERSION:-}
      INTEGRIQ_VERSION: ${INTEGRIQ_VERSION:-}
      FILINQ_VERSION: ${FILINQ_VERSION:-}
      LAUNCHPAD_VERSION: ${LAUNCHPAD_VERSION:-}
      PIPELINQ_VERSION: ${PIPELINQ_VERSION:-}
      SHILLINQ_VERSION: ${SHILLINQ_VERSION:-}
      HERMIQ_VERSION: ${HERMIQ_VERSION:-}
      ZAAKAFHANDELAPP_VERSION: ${ZAAKAFHANDELAPP_VERSION:-}
    volumes:
      - apps:/apps
    configs:
      - source: install-apps
        target: /install-apps.sh
        mode: "0755"
    command: ["/bin/sh", "/install-apps.sh"]

  nextcloud:
    image: nextcloud:34-apache
    restart: unless-stopped
    ports:
      - "${CONNEXT_PORT:-8700}:80"
    depends_on:
      db:
        condition: service_healthy
      app-installer:
        condition: service_completed_successfully
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: nextcloud
      POSTGRES_DB: nextcloud
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: admin
      NEXTCLOUD_TRUSTED_DOMAINS: "localhost localhost:${CONNEXT_PORT:-8700} 127.0.0.1 127.0.0.1:${CONNEXT_PORT:-8700}"
      # Load-bearing. OpenCatalogi advertises this address to the federated
      # directory network, and refuses to broadcast a LOCAL one — which is what
      # stops a laptop demo from registering `http://localhost` as a peer in the
      # national directory at directory.opencatalogi.nl.
      OVERWRITECLIURL: "http://localhost:${CONNEXT_PORT:-8700}"
      OVERWRITEPROTOCOL: http
      # The ecosystem is large; the default 512M is not enough to enable it all.
      PHP_MEMORY_LIMIT: 2G
      PHP_UPLOAD_LIMIT: 512M
    volumes:
      - nextcloud:/var/www/html
      - apps:/var/www/html/custom_apps
    configs:
      - source: enable-apps
        target: /docker-entrypoint-hooks.d/post-installation/10-enable-connext-apps.sh
        mode: "0755"

configs:
  # EVERY SHELL VARIABLE BELOW IS `$$name`, NOT `$name`.
  # Compose interpolates `$name` inside `configs.content` before the file is
  # written, so an un-escaped shell variable arrives as an EMPTY STRING and the
  # script runs on regardless. `$$` survives interpolation and reaches /bin/sh
  # as `$`. `${CONNEXT_PORT:-8700}` is deliberately NOT escaped — that one is
  # Compose's to substitute.
  install-apps:
    content: |
      #!/bin/sh
      set -u
      apk add --no-cache curl tar jq >/dev/null

      # RESOLVING "NEWEST" TAKES TWO CORRECTIONS, NOT ONE.
      #
      # 1. The GitHub "latest release" endpoint EXCLUDES pre-releases, and 404s
      #    for a repository that has only ever shipped them — which reads exactly
      #    like "no such app". So ask the releases LIST instead.
      #
      # 2. THE LIST IS NOT ORDERED BY CREATION DATE. Taking the first entry looks
      #    right and is not. Measured 2026-08-27 on openregister:
      #
      #      v1.1.6                          created 10:17:45   <- returned first
      #      v1.1.6-unstable.20260827110807  created 11:09:37   <- actually newest
      #
      #    Picking the first entry installed an OLDER OpenRegister than the leaf
      #    apps needed, and the failure surfaced far away from the cause: integriq
      #    aborted with `Class "OCA\OpenRegister\AppHost\Repair\
      #    GenericInitializeActions" not found`, and every OpenCatalogi API route
      #    500'd on `Class "OCA\OpenRegister\AppHost\Routes" not found`.
      #
      # Sorting by created_at explicitly is the fix; jq is here for that.
      resolve_latest() {
        curl -fsSL "https://api.github.com/repos/ConductionNL/$$1/releases?per_page=50" \
          | jq -r '[.[] | select(.draft | not)] | sort_by(.created_at) | last | .tag_name // empty' \
          | sed 's/^v//'
      }

      FAILED=""

      # install_app <repo> <app-id> <version> <asset-prefix>
      install_app() {
        repo="$$1"; appid="$$2"; version="$$3"; asset="$$4"

        if [ -f "/apps/$$appid/appinfo/info.xml" ]; then
          echo "==> $$appid already present, skipping"
          return 0
        fi

        if [ -z "$$version" ]; then
          version="$$(resolve_latest "$$repo")"
          if [ -z "$$version" ]; then
            echo "!! $$appid: no release found in $$repo"
            FAILED="$$FAILED $$appid"
            return 0
          fi
        fi

        url="https://github.com/ConductionNL/$$repo/releases/download/v$$version/$$asset-$$version.tar.gz"
        echo "==> installing $$appid $$version"

        rm -rf /tmp/stage && mkdir -p /tmp/stage
        if ! curl -fsSL "$$url" | tar -xz -C /tmp/stage 2>/dev/null; then
          echo "!! $$appid: download failed ($$url)"
          FAILED="$$FAILED $$appid"
          return 0
        fi

        # The archive's top-level directory is not guaranteed to equal the
        # Nextcloud app id — several repos still ship archives under their OLD
        # name. Nextcloud resolves an app by DIRECTORY name, so installing it
        # under the archive's name yields an app that is never loaded.
        top="$$(ls /tmp/stage | head -n1)"
        [ "$$top" = "$$appid" ] || echo "    archive unpacked as '$$top', installing as '$$appid'"
        rm -rf "/apps/$$appid"
        mv "/tmp/stage/$$top" "/apps/$$appid"
        rm -rf /tmp/stage
      }

      #            repo             app-id            version                       asset-prefix
      install_app  openregister     openregister      "$$OPENREGISTER_VERSION"      openregister
      install_app  opencatalogi     opencatalogi      "$$OPENCATALOGI_VERSION"      opencatalogi
      install_app  portaliq         portaliq          "$$PORTALIQ_VERSION"          portaliq
      # Repo AND app id both moved to `thematiq`. Verified against the released
      # archive's own appinfo/info.xml (<id>thematiq</id>), not assumed from a
      # local checkout — the id moves per app and at a different time from the
      # repo, and installing under the wrong directory name yields an app
      # Nextcloud refuses with "appinfo file cannot be read".
      install_app  thematiq         thematiq          "$$THEMATIQ_VERSION"          thematiq
      install_app  integriq         integriq          "$$INTEGRIQ_VERSION"          integriq
      install_app  filinq           filinq            "$$FILINQ_VERSION"            filinq
      install_app  launchpad        launchpad         "$$LAUNCHPAD_VERSION"         launchpad
      install_app  pipelinq         pipelinq          "$$PIPELINQ_VERSION"          pipelinq
      install_app  shillinq         shillinq          "$$SHILLINQ_VERSION"          shillinq
      install_app  hermiq           hermiq            "$$HERMIQ_VERSION"            hermiq
      install_app  zaakafhandelapp  zaakafhandelapp   "$$ZAAKAFHANDELAPP_VERSION"   zaakafhandelapp

      # 33 is www-data inside the Nextcloud image.
      chown -R 33:33 /apps

      echo "==> apps present: $$(ls /apps | tr '\n' ' ')"
      if [ -n "$$FAILED" ]; then
        # A missing leaf app must not abort the whole ecosystem, but it must not
        # be silent either: an app that failed to download is indistinguishable
        # from one that was never meant to be here once the log scrolls past.
        echo "!! NOT INSTALLED:$$FAILED"
        echo "!! The rest of the stack still starts. Re-run 'up' to retry them."
      fi

      # OpenRegister is not optional — every other app declares registers
      # against it, and enabling a leaf without it produces an app with no
      # register to attach to.
      [ -f /apps/openregister/appinfo/info.xml ] || { echo "!! openregister missing; aborting"; exit 1; }

  enable-apps:
    content: |
      #!/bin/sh
      set -u
      # ORDER IS NOT ARBITRARY. OpenRegister owns the registers and schemas every
      # other app declares against, and NLDesign supplies the themes the portal
      # resolves, so both come before the leaves. A leaf enabled first finds no
      # register to attach to.
      for app in openregister thematiq opencatalogi portaliq integriq filinq \
                 launchpad pipelinq shillinq hermiq zaakafhandelapp; do
        if [ ! -f "/var/www/html/custom_apps/$$app/appinfo/info.xml" ]; then
          echo "==> $$app not installed, skipping"
          continue
        fi
        echo "==> enabling $$app"
        php /var/www/html/occ app:enable "$$app" || echo "!! failed to enable $$app"
      done

      echo "==> Connext is up: http://localhost:${CONNEXT_PORT:-8700}"
      echo "==> OpenCatalogi demo portal: http://localhost:${CONNEXT_PORT:-8700}/apps/portaliq/site?portal=demo"
